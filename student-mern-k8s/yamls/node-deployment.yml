apiVersion: apps/v1
kind: Deployment

metadata:
  name: node-deploy

spec:
  replicas: 2

  selector:
    matchLabels:
      app: node

  template:
    metadata:
      labels:
        app: node

    spec:
      containers:
        - name: node
          image: abhisalunke16/student-backend:v1

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: node-config
